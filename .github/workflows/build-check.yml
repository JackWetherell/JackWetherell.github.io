name: Build check

# The published pages are generated from content/ + templates/, so this checks
# that whoever edited the content also committed the rebuilt pages.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Pages match content
        run: python3 build.py --check
