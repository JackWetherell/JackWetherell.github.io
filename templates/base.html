<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{title}}</title>
    <meta name="description" content="{{description}}">
    <meta name="author" content="{{author}}">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0a0e17">
    <link rel="canonical" href="{{canonical}}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Dr. Jack Wetherell">
    <meta property="og:title" content="{{title}}">
    <meta property="og:description" content="{{description}}">
    <meta property="og:url" content="{{canonical}}">
    <meta property="og:image" content="{{og_image}}">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{title}}">
    <meta name="twitter:description" content="{{description}}">
    <meta name="twitter:image" content="{{og_image}}">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/favicon.svg">
    <link rel="stylesheet" href="assets/css/site.css">
    {{head_extra}}
  </head>
  <body class="{{page_class}}">
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <div class="wrap header-inner">
        <a class="brand" href="index.html">
          <span class="brand-mark" aria-hidden="true">JW</span>
          <span class="brand-text">
            <strong>Dr. Jack Wetherell</strong>
            <span>Research and Development Scientist</span>
          </span>
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
          <span class="nav-toggle-bars" aria-hidden="true"></span>
          <span class="nav-toggle-label">Menu</span>
        </button>
        <nav class="site-nav" id="site-nav" aria-label="Primary">
          {{nav}}
        </nav>
      </div>
    </header>

    <main id="main">
{{content}}
    </main>

    <footer class="site-footer">
      <div class="wrap footer-inner">
        <p class="footer-name">Dr. Jack Wetherell &middot; Los Angeles, USA</p>
        <ul class="footer-links">
          <li><a href="mailto:jack.wetherell@gmail.com">Email</a></li>
          <li><a href="https://scholar.google.co.uk/citations?user=_LLNmaQAAAAJ&amp;hl=en">Google Scholar</a></li>
          <li><a href="https://www.linkedin.com/in/jack-wetherell-921493158/">LinkedIn</a></li>
          <li><a href="https://github.com/JackWetherell">GitHub</a></li>
          <li><a href="https://www.researchgate.net/profile/Jack_Wetherell2">ResearchGate</a></li>
        </ul>
        <p class="footer-meta">&copy; {{year}} Jack Wetherell</p>
      </div>
    </footer>

    <script src="assets/js/site.js" defer></script>
  </body>
</html>
